repos:
  - repo: local
    hooks:
      - id: kb-lint
        name: kb lint
        entry: python -m kb.cli lint --scope agent-kb
        language: system
        pass_filenames: false
      - id: kb-index
        name: kb index sync
        entry: python -m kb.cli index --check --repo-name agent-kb
        language: system
        pass_filenames: false
